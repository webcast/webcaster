<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Webcaster</title>
    <link rel="stylesheet" href="css/client.css" />
    <script type="importmap">
      { "imports": { "@webcast.js/socket": "https://cdn.jsdelivr.net/npm/@webcast.js/socket@2.0.0/+esm" } }
    </script>
    <script src="https://cdn.jsdelivr.net/gh/webcast/taglib.js@e15bc25f13fb0bdf75240c5acecf891bc34749a7/dist/taglib.js" defer></script>
    <script type="module" src="dist/ui/main.js"></script>
  </head>

  <body>
    <header>
      <h1>Webcaster</h1>
    </header>

    <main>
      <section id="stream" class="panel" aria-labelledby="stream-title">
        <h2 id="stream-title">Stream</h2>
        <video class="camera-preview" muted playsinline hidden></video>
        <form class="stream-form">
          <fieldset class="settings">
            <label>
              Destination
              <input name="url" type="url" value="ws://source:hackme@localhost:8080/mount" required />
            </label>
            <label>Format <select name="format"></select></label>
            <label>Audio bitrate (kbit/s) <select name="audioBitrate"></select></label>
            <label class="video-only" hidden>Video bitrate (Mbit/s) <select name="videoBitrate"></select></label>
            <div class="row" role="radiogroup" aria-label="Channels">
              <label><input type="radio" name="channels" value="2" checked /> Stereo</label>
              <label><input type="radio" name="channels" value="1" /> Mono</label>
            </div>
            <label class="camera-option" hidden><input type="checkbox" name="camera" /> Enable camera</label>
          </fieldset>
          <div class="row">
            <button type="submit" class="start">Start streaming</button>
            <button type="button" class="cue" aria-pressed="false" title="Listen to the mix">CUE</button>
          </div>
          <p class="status" role="status"></p>
        </form>

        <form class="metadata-form">
          <fieldset disabled>
            <legend>Metadata</legend>
            <label>Title <input name="title" /></label>
            <label>Artist <input name="artist" /></label>
            <button type="submit">Update metadata</button>
          </fieldset>
        </form>
      </section>

      <section id="deck-left" class="panel deck" aria-labelledby="deck-left-title"></section>

      <section id="mixer" class="panel" aria-labelledby="mixer-title">
        <h2 id="mixer-title">Mixer</h2>
        <label>
          Crossfader
          <input class="crossfader" type="range" min="0" max="100" value="50" />
        </label>
        <div class="row crossfader-labels" aria-hidden="true"><span>Playlist 1</span><span>Playlist 2</span></div>

        <div class="microphone">
          <h3>Microphone</h3>
          <div class="row">
            <button type="button" class="record" aria-pressed="false">Microphone on</button>
            <button type="button" class="cue" aria-pressed="false">CUE</button>
          </div>
          <div class="meters">
            <meter class="level" min="-60" max="0" low="-18" high="-6" optimum="-60" value="-60"></meter>
            <meter class="level" min="-60" max="0" low="-18" high="-6" optimum="-60" value="-60"></meter>
          </div>
          <label>Gain <input class="gain" type="range" min="0" max="150" value="100" /> <output class="gain-value">100%</output></label>
          <label>Source <select class="device"></select></label>
          <label title="Turns off echo cancellation, noise suppression and automatic gain, which degrade music">
            <input type="checkbox" class="line-in" /> Line-in (no voice processing)
          </label>
        </div>
      </section>

      <section id="deck-right" class="panel deck" aria-labelledby="deck-right-title"></section>
    </main>

    <template id="deck-template">
      <h2 class="deck-title"></h2>
      <div class="row transport">
        <button type="button" class="play" aria-label="Play">▶</button>
        <button type="button" class="previous" aria-label="Previous track">⏮</button>
        <button type="button" class="next" aria-label="Next track">⏭</button>
        <button type="button" class="stop" aria-label="Stop">■</button>
        <button type="button" class="cue" aria-pressed="false">CUE</button>
      </div>
      <input class="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Position" disabled />
      <output class="time">--:-- / --:--</output>
      <div class="meters">
        <meter class="level" min="-60" max="0" low="-18" high="-6" optimum="-60" value="-60"></meter>
        <meter class="level" min="-60" max="0" low="-18" high="-6" optimum="-60" value="-60"></meter>
      </div>
      <label>Gain <input class="gain" type="range" min="0" max="150" value="100" /> <output class="gain-value">100%</output></label>
      <table class="tracks">
        <thead>
          <tr><th>#</th><th>Title</th><th>Artist</th><th>Duration</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <label class="add-files">Add files <input class="files" type="file" accept="audio/*" multiple /></label>
      <label><input class="play-through" type="checkbox" checked /> Play through</label>
      <label><input class="loop" type="checkbox" /> Repeat playlist</label>
    </template>
  </body>
</html>
